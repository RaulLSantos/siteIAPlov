    <!-- Fallback runtime para favicon:
         - tenta carregar /siteIAPlov/favicon.png
         - em caso de erro (404) usa /siteIAPlov/assets/logo-iap.jpg como fallback
         Isso cobre dev e produção sem exigir alteração de outros arquivos. -->
    <script>
      (function () {
        try {
          const base = '/siteIAPlov/';
          const primary = base + 'favicon.png';
          const fallback = base + 'assets/logo-iap.jpg';

          function setFavicon(href) {
            let link = document.querySelector("link[rel~='icon']");
            if (!link) {
              link = document.createElement('link');
              link.rel = 'icon';
              document.getElementsByTagName('head')[0].appendChild(link);
            }
            link.href = href;
          }

          const probe = new Image();
          probe.onload = function () {
            setFavicon(primary);
          };
          probe.onerror = function () {
            setFavicon(fallback);
          };
          // dispara a checagem
          probe.src = primary;
        } catch (e) {
          // não atrapalhar o carregamento da página se algo falhar
          console.warn('[favicon-fallback] erro:', e);
        }
      })();
    </script>
