<!-- Cabeçalho estático mínimo (apenas logo e título). Resolve via <base> e não duplica o menu do React. -->
<header id="static-header" style="display:flex;align-items:center;gap:12px;padding:0.6rem 1rem;background:var(--sidebar-background);box-shadow:0 1px 0 rgba(0,0,0,0.04);">

  </a>
  <!-- Espaço reservado para o menu (React renderiza o menu real quando montar) -->
  <div style="margin-left:auto"></div>
</header>

<!-- Remove o cabeçalho estático quando o React monta (evita duplicação visual) -->
<script>
  (function () {
    // aguarda o DOM e depois espera curto prazo para o React montar
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const header = document.getElementById('static-header');
        // se o root já tiver filhos (React montou), oculta o header estático
        if (header && document.getElementById('root')?.children.length > 0) {
          header.style.display = 'none';
        }
      }, 700);
    });
  })();
</script>
